[package]
name = "model-router"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small Rust gateway for multiple OpenAI-compatible local LLM servers"
repository = "https://github.com/tjm8874/model-router"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
